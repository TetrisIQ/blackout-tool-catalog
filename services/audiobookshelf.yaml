id: audiobookshelf
name: Audiobookshelf (audiobooks)
description: Plays the installed audiobook packs in any browser or app, remembers your place, no internet needed.
category: services
type: container
source:
  image: 'ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa'
size_bytes: 160000000
license:
  spdx: GPL-3.0-only
  url: https://github.com/advplyr/audiobookshelf/blob/master/LICENSE
service:
  host: audiobookshelf.kit.local
  port: 13378
  health_path: /healthcheck
  provision: audiobookshelf
  env:
    PORT: '13378'
    CONFIG_PATH: /config
    METADATA_PATH: /config/metadata
  mounts:
    - {kind: data, target: /config}
    - {kind: media, media: audiobooks, target: /audiobooks, read_only: true}
