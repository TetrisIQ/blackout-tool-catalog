name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TetrisIQ/blackout-tool
          path: kit
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kit
      - run: cargo build --release --locked --manifest-path kit/Cargo.toml
      # the kit checkout sits inside the workspace; remove it so only the catalog is checked
      - run: |
          mv kit/target/release/kit "$RUNNER_TEMP/kit"
          rm -rf kit
          "$RUNNER_TEMP/kit" catalog check .
