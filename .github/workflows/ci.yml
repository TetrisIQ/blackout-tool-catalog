name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TetrisIQ/blackout-tool
          path: kit
          # the kit repository is private: add a read-only token as secret KIT_READ_TOKEN
          token: ${{ secrets.KIT_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kit
      - run: cargo build --release --locked --manifest-path kit/Cargo.toml
      - run: kit/target/release/kit catalog check .
