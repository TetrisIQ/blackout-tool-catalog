name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        run: |
          tar czf catalog.tar.gz --exclude=.git --exclude=.github --transform 's,^\./,,' .
          sha256sum catalog.tar.gz | cut -d' ' -f1 > catalog.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            catalog.tar.gz
            catalog.tar.gz.sha256
